<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISTRO Intro</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #0f172a, #020617);
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* Particles */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #38bdf8;
  border-radius: 50%;
  opacity: 0.6;
  animation: float 6s infinite linear;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* Container */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* Glow (bigger for larger logo) */
.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(59,130,246,0.4), transparent);
  border-radius: 50%;
  filter: blur(50px);
  animation: pulse 3s infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.2); opacity: 0.7; }
}

/* Logo (BIG SIZE HERE) */
.logo {
  width: 480px; /* 🔥 Increased size */
  opacity: 0;
  animation: fadeInLogo 2s ease forwards;
  animation-delay: 1s;
}

@keyframes fadeInLogo {
  from { opacity: 0; }
  to { opacity: 1; }
}



/* Tagline */
.tagline {
  font-size: 18px;
  margin-top: 10px;
  opacity: 0;
  animation: fadeUp 2s ease forwards;
  animation-delay: 3s;
}

/* Button */
.btn {
  margin-top: 30px;
  padding: 14px 30px;
  background: #F97316;
  border: none;
  border-radius: 30px;
  color: white;
  font-size: 18px;
  cursor: pointer;
  opacity: 0;
  animation: fadeUp 2s ease forwards;
  animation-delay: 4s;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
  background: #ea580c;
}

/* Text animation */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Fade out */
.fade-out {
  animation: fadeOut 1s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; }
}
</style>
</head>

<body>

<!-- Particles -->
<script>
for(let i=0;i<40;i++){
  let p = document.createElement("div");
  p.className="particle";
  p.style.left = Math.random()*100+"vw";
  p.style.animationDuration = (4 + Math.random()*4) + "s";
  document.body.appendChild(p);
}
</script>

<div class="container" id="app">

  <div class="glow"></div>

  <!-- Logo -->
  <img src="logo.png.png" class="logo" alt="MISTRO Logo">

  <div class="title">MISTRO</div>

  <div class="tagline">Service On. Stress Gone.</div>

  <button class="btn" onclick="startApp()">Get Start</button>

</div>

<script>
function startApp(){
  document.getElementById("app").classList.add("fade-out");
  setTimeout(()=>{
    window.location.href = "../index.html";
  },1000);
}
</script>

</body>
</html>
